# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK closed its first build epic in July: ten working sessions and twenty merged pull requests took it from an empty repository to a playable multiplayer text world, with real authentication, a sandboxed player-programmable engine, and persistent touches like lockable chests and undo. It's the most complete build currently live in the studio."
week_note: "Studio releases have been quiet since midsummer; the last project news was Canonical Castles founding in late July. Six project sites are live today: KDC's data-center dataset and map, menowise's cited menopause-health entries, backpacks' carry-gear aggregator, Lemonade Stand's mobile business game, Canonical Castles' source-cited castle count, and GenMURK, now a playable multiplayer text world after its first build epic closed."
updated: "2026-10-02"
