# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "kdc"
featured_note: "KDC is the studio's flagship dataset — US data center projects tracked from announcements, permits, and construction as an open, source-cited record. It launched with 33 project-sites across seven states, a filterable status-coloured map with per-record locator pages, and a case study documenting how the dataset is built and kept current — a ledger entry for every run, every change a reviewed pull request."
week_note: "The studio's most recent activity dates to mid-to-late July: Canonical Castles joined with a source-cited answer to how many castles exist, counted per definition rather than as a single disputed number, and GenMURK's first build epic closed, taking its clean-room multiplayer text world from an empty repository to a playable one with real authentication and a working softcode engine. It has been quiet since — KDC, menowise, backpacks, Lemonade Stand, GenMURK, and Canonical Castles all remain live, each sourced and reviewed before it shipped."
updated: "2026-10-15"
