# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK's first build epic closed this round: ten working sessions and twenty merged pull requests took a clean-room multiplayer text world from an empty repository to a playable one, with real-time movement and speech, authentication with a graded capability model, and a sandboxed, player-programmable softcode engine, each claim graded against what main actually holds."
week_note: "Canonical Castles joined the studio, asking how many castles exist by counting per definition rather than publishing one contested number. GenMURK's first build epic closed: a clean-room multiplayer text world went from an empty repository to a playable game with building, movement, real authentication, and a player-programmable softcode engine. KDC, menowise, backpacks, and Lemonade Stand remain live from their earlier launches."
updated: "2026-10-30"
