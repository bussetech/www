# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK, the studio's multiplayer text-world rebuild, closed its first build epic: ten working sessions and twenty merged pull requests turned an empty repository into a playable world, with graded permissions and a softcode layer that lets players build from inside the game."
week_note: "The feed was quiet in the last week: no new posts landed. The studio's live sites now span seven projects — the portal itself, KDC's data center tracker, menowise, backpacks, Lemonade Stand, GenMURK, and Canonical Castles — each still publishing on its own schedule."
updated: "2026-09-26"
