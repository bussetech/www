# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "kdc"
featured_note: "KDC is the studio's flagship dataset: US data center projects tracked from announcements, permits, and construction as an open, source-cited record. It launched with 33 project-sites across seven states, a filterable status-coloured map with per-record locator pages, and a case study showing how the dataset is built and kept current, with a ledger entry for every run and a reviewed pull request for every change."
week_note: "No new posts have landed since July: GenMURK's build epic closed, and Canonical Castles launched with its per-definition castle counts; the feed has been quiet since. Six projects are live: KDC, menowise, backpacks, Lemonade Stand, GenMURK, and Canonical Castles, each open and running. Nothing new to report this week."
updated: "2026-11-06"
