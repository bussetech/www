featured: "genmurk"
featured_note: "GenMURK's first build epic closed, taking the clean-room text-world rebuild from an empty repository to a playable world across ten sessions and twenty merged pull requests. Players now walk, build, and program the world in softcode, with graded authentication and the small persistent details — chests, notes, wizardly discipline — that make a MUSE feel lived in."
week_note: "It's been a quiet stretch for new posts: the most recent studio activity dates to late July, when GenMURK's build epic closed with a playable world and Canonical Castles launched as a source-cited dataset answering how many castles exist, broken down by definition. KDC, Menowise, Backpacks, and Lemonade Stand remain live and unchanged this week."
