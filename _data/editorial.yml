# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK's first build epic closed after ten working sessions and twenty merged pull requests, taking the project from an empty repository to a playable multiplayer text world with real authentication, a softcode engine, and a graded capability model. It is a clean-room rebuild inspired by the early-1990s MUSE lineage, not an adoption of the original code."
week_note: "It has been a quiet stretch for new launches. The studio's active projects remain live: kdc's data center dataset and map, menowise's cited menopause and midlife health guide, backpacks' carry aggregator, Lemonade Stand's business-game homage, GenMURK's multiplayer text world, and Canonical Castles' per-definition castle count."
updated: "2026-09-10"
