# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK's first build epic closed out this stretch: ten sessions and twenty merged pull requests took a clean-room text-world rebuild from an empty repository to a playable world, with movement, building, real authentication, and player-programmable softcode graded against what actually shipped."
week_note: "It's been a quiet stretch, with no new posts across the studio's feeds in the last week. Six projects stay live: KDC's data-center dataset and map, menowise's cited menopause and midlife-health entries, backpacks' technical-carry aggregator, Lemonade Stand's playable business-game homage, GenMURK's multiplayer text world (its first build epic now closed), and Canonical Castles, the studio's newest addition, which counts castles by definition instead of by decree."
updated: "2026-09-05"
