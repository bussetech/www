# editorial.yml — the homepage's short editorial voice.
#
# Maintained by gn_portal_editor ("Gnome Portal Editor"), which reviews the
# aggregated project feeds daily and refreshes these blurbs via PR — it never
# pushes to main. Humans may edit too; the gnome treats the current content
# as prior art, not as something to clobber.
#
#   featured        name of a listed repo to feature on the homepage ("" = none)
#   featured_note   one or two sentences on why it's featured right now
#   week_note       "this week in the studio" — a few plain sentences, no hype
#   updated         ISO date of the last editorial pass

featured: "genmurk"
featured_note: "GenMURK closed its first build epic this month: ten working sessions and twenty merged pull requests turned an empty repository into a playable multiplayer text world. Players can move between rooms, build and script objects with the world's own softcode language, and act under a real authentication and capability model, with the backlog each session leaves behind written down and ranked."
week_note: "GenMURK's build epic closed this month: ten sessions and twenty merged pull requests turned an empty repository into a full playable world with movement, building, scripting, and real authentication. Canonical Castles also joined the studio, a source-cited dataset answering how many castles there are per definition rather than with a single disputed number. KDC, menowise, backpacks, and Lemonade Stand continue to run as live, source-cited sites."
updated: "2026-11-12"
